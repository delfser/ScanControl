name: Windows installer
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./tools/Build-Installer.ps1
      - name: Verify install and uninstall
        shell: pwsh
        run: ./tools/Test-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScanControl-Windows-Installer
          path: artifacts/installer/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScanControl-Windows-Installer
          path: installer
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "ScanControl $RELEASE_TAG" --prerelease --notes "Windows x64. Installer herunterladen und ausführen. Hardwareprüfung am BC780XLT steht noch aus."
          fi
          gh release upload "$RELEASE_TAG" installer/* --clobber
